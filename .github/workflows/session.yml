name: Comparatif 4 Bots Crypto (Paper)

on:
  schedule:
    - cron: '30 13 * * 2-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        bot_id: [bot1, bot2, bot3, bot4]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer ${{ matrix.bot_id }} (120 min)
        env:
          BOT_ID: ${{ matrix.bot_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --bot-id ${{ matrix.bot_id }}
